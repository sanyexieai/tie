[workspace]
members = [".", "crates/tie-common", "crates/tie-local", "crates/tie-s3", "crates/tie-storage"]
resolver = "2"

[package]
name = "tie"
version = "1.0.17"
description = "A local-first knowledge editor"
authors = ["Tie contributors"]
edition = "2021"

[lib]
name = "tie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
tie-storage = { path = "crates/tie-storage", features = ["local", "s3"] }
minio = { version = "0.4", default-features = false, features = ["rustls-tls", "default-crypto", "http2"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-updater = "2"
