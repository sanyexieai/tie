[package]
name = "tie-local"
version = "0.1.0"
description = "Tie local Markdown workspace storage (filesystem, no Tauri)"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
ring = "0.17"
tie-common = { path = "../tie-common" }
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
