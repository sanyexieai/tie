[package]
name = "tie-cli"
version = "0.1.0"
description = "Tie local-first CLI (headless workspace access)"
edition = "2021"

[lib]
name = "tie_cli"
path = "src/lib.rs"

[[bin]]
name = "tie-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tie-local = { path = "../tie-local" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
