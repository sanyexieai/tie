[package]
name = "tie-cli"
version = "0.1.0"
description = "Tie local-first CLI (headless workspace access)"
edition = "2021"

[[bin]]
name = "tie-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tie-local = { path = "../tie-local" }
