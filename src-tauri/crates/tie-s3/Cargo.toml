[package]
name = "tie-s3"
version = "0.1.0"
description = "Tie S3-compatible object storage backend (no Tauri)"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
minio = { version = "0.4", default-features = false, features = ["rustls-tls", "default-crypto", "http2"] }
tie-common = { path = "../tie-common" }
tie-local = { path = "../tie-local" }
