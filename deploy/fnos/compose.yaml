name: tie-backend
services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/fnos/Dockerfile
    image: tie-backend:${TIE_VERSION:-latest}
    restart: unless-stopped
    env_file: backend.env
    volumes:
      - backend-v2-data:/data
    logging:
      options:
        max-size: 10m
        max-file: '3'
  https:
    image: nginx:stable-alpine
    entrypoint: ['/bin/sh', '/etc/nginx/tie-entrypoint.sh']
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '32043:443'
    environment:
      TLS_CERT_FILE: ${TLS_CERT_FILE:?Set certificate path relative to FNOS_CERT_DIR}
      TLS_KEY_FILE: ${TLS_KEY_FILE:?Set private key path relative to FNOS_CERT_DIR}
    volumes:
      - ./https-entrypoint.sh:/etc/nginx/tie-entrypoint.sh:ro
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${FNOS_CERT_DIR:?Set fnOS certificate directory}:/fnos-certs:ro
      - ../../dist:/usr/share/nginx/html:ro
    logging:
      options:
        max-size: 10m
        max-file: '3'
volumes:
  backend-v2-data:
