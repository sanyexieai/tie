name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:

env:
  RUST_TOOLCHAIN: '1.94.0'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Typecheck frontend
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build frontend for E2E
        run: npm run build

      - name: Test release metadata
        run: python3 scripts/merge-updater-manifest.py --self-test

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libxdo-dev \
            libssl-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev \
            rpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Test tie-local + build tie CLI
        run: |
          cargo test -p tie-local -p tie-cli --manifest-path src-tauri/Cargo.toml
          npm run tie:prepare
          test -x src-tauri/target/release/tie-cli

      - name: Run backend API tests
        run: npm run test:backend
        env:
          TIE_TEST_CLI: ${{ github.workspace }}/src-tauri/target/release/tie-cli

      - name: Run E2E smoke tests
        run: npm run test:e2e
        env:
          CI: true
          TIE_TEST_CLI: ${{ github.workspace }}/src-tauri/target/release/tie-cli

      - name: Check Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test desktop backend
        run: cargo test --manifest-path src-tauri/Cargo.toml -p tie --lib

  build-linux:
    runs-on: ubuntu-22.04
    needs: check
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libxdo-dev \
            libssl-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev \
            rpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Tauri app (Linux)
        run: npm run tauri:build:linux -- --config src-tauri/tauri.ci.conf.json
        env:
          CI: true

      - name: Upload Linux bundle artifacts
        uses: actions/upload-artifact@v5
        with:
          name: tie-linux-bundle
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Test Windows workspace loading
        run: cargo test -p tie-local --manifest-path src-tauri/Cargo.toml workspace::tests -- --nocapture

      - name: Test Windows solution paths
        run: cargo test -p tie-local --manifest-path src-tauri/Cargo.toml solution::tests -- --nocapture

      - name: Build Tauri app (Windows)
        run: npm run tauri:build:windows -- --config src-tauri/tauri.ci.conf.json
        env:
          CI: true

      - name: Upload Windows bundle artifacts
        uses: actions/upload-artifact@v5
        with:
          name: tie-windows-bundle
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
